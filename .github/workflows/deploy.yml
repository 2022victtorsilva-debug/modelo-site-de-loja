name: Deploy Vitta Moda to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Restore existing HD images
        shell: bash
        run: |
          set -e
          curl -fL "https://images.pexels.com/photos/7679461/pexels-photo-7679461.jpeg?cs=srgb&dl=pexels-mart-production-7679461.jpg&fm=jpg" -o src/assets/vestidos.jpg
          curl -fL "https://images.pexels.com/photos/5424907/pexels-photo-5424907.jpeg?cs=srgb&dl=pexels-arina-krasnikova-5424907.jpg&fm=jpg" -o src/assets/conjuntos.jpg
          curl -fL "https://images.pexels.com/photos/8989866/pexels-photo-8989866.jpeg?cs=srgb&dl=pexels-a-darmel-8989866.jpg&fm=jpg" -o src/assets/blusas.jpg
          curl -fL "https://images.pexels.com/photos/5418929/pexels-photo-5418929.jpeg?cs=srgb&dl=pexels-arina-krasnikova-5418929.jpg&fm=jpg" -o src/assets/calcas.jpg
          curl -fL "https://images.pexels.com/photos/37308627/pexels-photo-37308627.jpeg?cs=srgb&dl=pexels-pexels-user-2159008650-37308627.jpg&fm=jpg" -o src/assets/lookA.jpg
          curl -fL "https://images.pexels.com/photos/11890760/pexels-photo-11890760.jpeg?cs=srgb&dl=pexels-dasha-horoshaya-218646645-11890760.jpg&fm=jpg" -o src/assets/lookB.jpg
          curl -fL "https://images.pexels.com/photos/26292713/pexels-photo-26292713.jpeg?cs=srgb&dl=pexels-noon-26292713.jpg&fm=jpg" -o src/assets/loja.jpg

      - name: Build static site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
