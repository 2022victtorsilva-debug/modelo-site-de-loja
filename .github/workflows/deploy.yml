name: Deploy Vitta Moda to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Apply selected portfolio images
        shell: bash
        run: |
          set -e
          base64 -d src/assets/hero.b64 > src/assets/hero.jpg
          curl -fL "https://images.pexels.com/photos/12208801/pexels-photo-12208801.jpeg?cs=srgb&dl=pexels-kelvinocta16-12208801.jpg&fm=jpg" -o src/assets/vestidos.jpg
          curl -fL "https://images.pexels.com/photos/9168240/pexels-photo-9168240.jpeg?cs=srgb&dl=pexels-cottonbro-9168240.jpg&fm=jpg" -o src/assets/conjuntos.jpg
          curl -fL "https://images.pexels.com/photos/17879064/pexels-photo-17879064.jpeg?cs=srgb&dl=pexels-nur-demirbas-627769864-17879064.jpg&fm=jpg" -o src/assets/blusas.jpg
          curl -fL "https://images.pexels.com/photos/8948833/pexels-photo-8948833.jpeg?cs=srgb&dl=pexels-soulofmurcidus-8948833.jpg&fm=jpg" -o src/assets/calcas.jpg
          curl -fL "https://images.pexels.com/photos/4428045/pexels-photo-4428045.jpeg?cs=srgb&dl=pexels-august-de-richelieu-4428045.jpg&fm=jpg" -o src/assets/lookA.jpg
          curl -fL "https://images.pexels.com/photos/18532851/pexels-photo-18532851.jpeg?cs=srgb&dl=pexels-mauricio-casas-454804780-18532851.jpg&fm=jpg" -o src/assets/lookB.jpg
          curl -fL "https://images.pexels.com/photos/7618822/pexels-photo-7618822.jpeg?cs=srgb&dl=pexels-humeyradmrc-7618822.jpg&fm=jpg" -o src/assets/loja.jpg

      - name: Build static site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
