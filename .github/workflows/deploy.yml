name: Deploy Vitta Moda to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Replace images with selected HD assets
        shell: bash
        run: |
          set -e
          curl -fL "https://images.pexels.com/photos/5531549/pexels-photo-5531549.jpeg?auto=compress&cs=tinysrgb&w=1800" -o src/assets/hero.jpg
          curl -fL "https://images.pexels.com/photos/10406624/pexels-photo-10406624.jpeg?auto=compress&cs=tinysrgb&w=1400" -o src/assets/vestidos.jpg
          curl -fL "https://images.pexels.com/photos/8205479/pexels-photo-8205479.jpeg?auto=compress&cs=tinysrgb&w=1400" -o src/assets/conjuntos.jpg
          curl -fL "https://images.pexels.com/photos/26607751/pexels-photo-26607751.jpeg?auto=compress&cs=tinysrgb&w=1400" -o src/assets/blusas.jpg
          curl -fL "https://images.pexels.com/photos/31400265/pexels-photo-31400265.jpeg?auto=compress&cs=tinysrgb&w=1400" -o src/assets/calcas.jpg
          curl -fL "https://images.pexels.com/photos/16928176/pexels-photo-16928176.jpeg?auto=compress&cs=tinysrgb&w=1600" -o src/assets/lookA.jpg
          curl -fL "https://images.pexels.com/photos/11413723/pexels-photo-11413723.jpeg?auto=compress&cs=tinysrgb&w=1600" -o src/assets/lookB.jpg
          curl -fL "https://images.pexels.com/photos/32549960/pexels-photo-32549960.jpeg?auto=compress&cs=tinysrgb&w=1800" -o src/assets/loja.jpg

      - name: Build static site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
